name: Сборка Windows-приложения

on:
  workflow_dispatch:

jobs:
  build:
    name: Собрать File Atelier для Windows
    runs-on: windows-latest

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости сборки
        run: python -m pip install -e ".[build]"

      - name: Собрать единый исполняемый файл
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name FileAtelier --paths src --specpath build src/file_atelier/gui.py

      - name: Сохранить Windows-приложение
        uses: actions/upload-artifact@v4
        with:
          name: FileAtelier-Windows
          path: dist/FileAtelier.exe
          if-no-files-found: error
          retention-days: 14
